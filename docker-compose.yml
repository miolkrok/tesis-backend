version: '3.8'
services:
  traefik:
    image: traefik:v2.11
    command:
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:8888
      - --entrypoints.traefik.address=:8081
    ports:
      - "8888:8888"
      - "8081:8081" # dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    container_name: traefik
    networks:
      - microservices-network

  usuarios:
    build: ./app-usuarios
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.usuarios.rule=PathPrefix(`/usuarios`) || PathPrefix(`/auth`)"
      - "traefik.http.routers.usuarios.entrypoints=web"
      - "traefik.http.services.usuarios.loadbalancer.server.port=8080"
    container_name: usuarios-service
    expose:
      - "8080"
    networks:
      - microservices-network

  actividades:
    build: ./app-actividades
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.actividades.rule=PathPrefix(`/actividades`) || PathPrefix(`/imagenes`)"
      - "traefik.http.routers.actividades.entrypoints=web"
      - "traefik.http.services.actividades.loadbalancer.server.port=8090"
    container_name: actividades-service
    expose:
      - "8090"
    networks:
      - microservices-network
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      # URLs de servicios internos Docker (NO localhost)
      - QUARKUS_REST_CLIENT_PROVEEDORRESTCLIENT_URL=http://usuarios-service:8080
      - QUARKUS_REST_CLIENT_USUARIORESTCLIENT_URL=http://usuarios-service:8080
      - QUARKUS_REST_CLIENT_RESERVARESTCLIENT_URL=http://reservas-service:9080
      - QUARKUS_REST_CLIENT_BUSQUEDARESTCLIENT_URL=http://filtros-busqueda-service:8070
    depends_on:
      - usuarios

  busquedas:
    build: ./app-filtrosBusqueda
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.busquedas.rule=PathPrefix(`/busquedas`)"
      - "traefik.http.routers.busquedas.entrypoints=web"
      - "traefik.http.services.busquedas.loadbalancer.server.port=8070"
    container_name: filtros-busqueda-service
    expose:
      - "8070"
    networks:
      - microservices-network
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      # Configurar URLs de servicios internos de Docker
      - QUARKUS_REST_CLIENT_ACTIVIDADRESTCLIENT_URL=http://actividades-service:8090
      - QUARKUS_REST_CLIENT_OPINIONRESTCLIENT_URL=http://opiniones-service:8085
      - QUARKUS_REST_CLIENT_GALERIARESTCLIENT_URL=http://actividades-service:8090
    depends_on:
      - actividades
      - opiniones

  opiniones:
    build: ./app-opiniones
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opiniones.rule=PathPrefix(`/opiniones`)"
      - "traefik.http.routers.opiniones.entrypoints=web"
      - "traefik.http.services.opiniones.loadbalancer.server.port=8085"
    container_name: opiniones-service
    expose:
      - "8085"
    networks:
      - microservices-network
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      # Configurar URLs de servicios internos de Docker
      - QUARKUS_REST_CLIENT_ACTIVIDADRESTCLIENT_URL=http://actividades-service:8090
      - QUARKUS_REST_CLIENT_USUARIORESTCLIENT_URL=http://usuarios-service:8080
    depends_on:
      - usuarios
      - actividades
  reservas:
    build: ./app-reservas
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reservas.rule=PathPrefix(`/reservas`)"
      - "traefik.http.routers.reservas.entrypoints=web"
      - "traefik.http.services.reservas.loadbalancer.server.port=9080"
    container_name: reservas-service
    expose:
      - "9080"
    networks:
      - microservices-network
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      # Configurar URLs de servicios internos de Docker
      - QUARKUS_REST_CLIENT_ACTIVIDADRESTCLIENT_URL=http://actividades-service:8090
      - QUARKUS_REST_CLIENT_USUARIORESTCLIENT_URL=http://usuarios-service:8080
      - QUARKUS_REST_CLIENT_PAGORESTCLIENT_URL=http://pagos-service:9090
    depends_on:
      - usuarios
      - actividades
  pagos:
    build: ./app-pagos
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pagos.rule=PathPrefix(`/pagos`)"
      - "traefik.http.routers.pagos.entrypoints=web"
      - "traefik.http.services.pagos.loadbalancer.server.port=9090"
    container_name: pagos-service
    expose:
      - "9080"
    networks:
      - microservices-network
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      # Configurar URLs de servicios internos de Docker
      - QUARKUS_REST_CLIENT_ACTIVIDADRESTCLIENT_URL=http://actividades-service:8090
      - QUARKUS_REST_CLIENT_USUARIORESTCLIENT_URL=http://usuarios-service:8080
    depends_on:
      - usuarios
      - actividades
      - reservas
networks:
  microservices-network:
    driver: bridge

