version: '3.8'

services:
  traefik:
    image: traefik:v2.11
    command:
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:8888
      - --entrypoints.traefik.address=:8081
    ports:
      - "8888:8888"
      - "8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    container_name: traefik

  postgres:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: LAOLl203
      POSTGRES_DB: tesis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  usuarios:
    image: miolkrok/app-usuarios
    container_name: usuarios-service
    depends_on:
      - postgres
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/usuariosdb
      QUARKUS_DATASOURCE_USERNAME: usuarios
      QUARKUS_DATASOURCE_PASSWORD: secret
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.usuarios.rule=PathPrefix(`/usuarios`)"
      - "traefik.http.routers.usuarios.entrypoints=web"
      - "traefik.http.routers.usuarios.middlewares=usuarios-stripprefix"
      - "traefik.http.middlewares.usuarios-stripprefix.stripprefix.prefixes=/usuarios"
      - "traefik.http.services.usuarios.loadbalancer.server.port=8080"

  actividades:
    image: miolkrok/app-actividades
    container_name: actividades-service
    depends_on:
      - postgres
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/actividadesdb
      QUARKUS_DATASOURCE_USERNAME: usuarios
      QUARKUS_DATASOURCE_PASSWORD: secret
    expose:
      - "8090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.actividades.rule=PathPrefix(`/actividades`)"
      - "traefik.http.routers.actividades.entrypoints=web"
      - "traefik.http.routers.actividades.middlewares=actividades-stripprefix"
      - "traefik.http.middlewares.actividades-stripprefix.stripprefix.prefixes=/actividades"
      - "traefik.http.services.actividades.loadbalancer.server.port=8090"

volumes:
  pgdata:
