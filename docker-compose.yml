version: '3.8'
services:
  traefik:
    image: traefik:v2.11
    command:
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:8888
      - --entrypoints.traefik.address=:8081
    ports:
      - "8888:8888"
      - "8081:8081" # dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    container_name: traefik

  usuarios:
    build: ./app-usuarios
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.usuarios.rule=PathPrefix(`/usuarios`)"
      - "traefik.http.routers.usuarios.entrypoints=web"
      - "traefik.http.services.usuarios.loadbalancer.server.port=8080"
    container_name: usuarios-service
    expose:
      - "8080"

  actividades:
    build: ./app-actividades
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.actividades.rule=PathPrefix(`/actividades`)"
      - "traefik.http.routers.actividades.entrypoints=web"
      - "traefik.http.services.actividades.loadbalancer.server.port=8090"
    container_name: actividades-service
    expose:
      - "8090"

  busquedas:
    image: miolkrok/app-filtros-busqueda
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.busquedas.rule=PathPrefix(`/busquedas`)"
      - "traefik.http.routers.busquedas.entrypoints=web"
      - "traefik.http.services.busquedas.loadbalancer.server.port=8070"
    container_name: filtros-busqueda-service
    expose:
      - "8070"

  opiniones:
    build: ./app-opiniones
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opiniones.rule=PathPrefix(`/opiniones`)"
      - "traefik.http.routers.opiniones.entrypoints=web"
      - "traefik.http.services.opiniones.loadbalancer.server.port=8085"
    container_name: opiniones-service
    expose:
      - "8085"

