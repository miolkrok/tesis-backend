quarkus.hibernate-orm.database.generation=update

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=LAOLl203

quarkus.datasource.jdbc.driver=org.postgresql.Driver
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/tesis

quarkus.http.port=8080

# JWT Configuration
# Clave pública para verificar tokens (consumidores)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=turismo-app

# Clave privada para firmar tokens (generador)
smallrye.jwt.sign.key.location=privateKey.pem

# Configuración adicional de JWT
quarkus.smallrye-jwt.auth-mechanism=MP-JWT

# Token expiration times
jwt.access-token.duration=PT30M
jwt.refresh-token.duration=P7D

# Security
quarkus.http.auth.basic=false
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS