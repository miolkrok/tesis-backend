# ===== CONFIGURACIÓN REST CLIENTS ULTRA OPTIMIZADA =====

# REST Clients URLs
quarkus.rest-client.ActividadRestClient.url=http://localhost:8090
quarkus.rest-client.OpinionRestClient.url=http://localhost:8085
quarkus.rest-client.GaleriaRestClient.url=http://localhost:8090

# TIMEOUTS AGRESIVOS para máximo rendimiento
quarkus.rest-client.ActividadRestClient.connect-timeout=100000
quarkus.rest-client.ActividadRestClient.read-timeout=200000
quarkus.rest-client.OpinionRestClient.connect-timeout=50000
quarkus.rest-client.OpinionRestClient.read-timeout=100000
quarkus.rest-client.GaleriaRestClient.connect-timeout=80000
quarkus.rest-client.GaleriaRestClient.read-timeout=150000

# CONNECTION POOLING OPTIMIZADO para máximo paralelismo
quarkus.rest-client.connection-pool-size=50
quarkus.rest-client.connection-ttl=30000
quarkus.rest-client.keep-alive-enabled=true
quarkus.rest-client.max-redirects=3

# Configuración específica por cliente
quarkus.rest-client.ActividadRestClient.connection-pool-size=20
quarkus.rest-client.OpinionRestClient.connection-pool-size=15
quarkus.rest-client.GaleriaRestClient.connection-pool-size=25

# CONFIGURACIÓN HTTP OPTIMIZADA
quarkus.http.io-threads=8
quarkus.http.worker-threads=32
quarkus.http.so-reuse-port=true
quarkus.http.tcp-quick-ack=true
quarkus.http.tcp-cork=true

# CONFIGURACIÓN REACTIVE OPTIMIZADA
quarkus.vertx.event-loops-pool-size=8
quarkus.vertx.worker-pool-size=32
quarkus.vertx.internal-blocking-pool-size=16

# CONFIGURACIÓN JVM OPTIMIZADA para microservicio
quarkus.native.additional-build-args=-J-Xmx2g,-J-Xms1g

# CORS OPTIMIZADO
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE
quarkus.http.cors.exposed-headers=Content-Disposition,Content-Type,Content-Length

# CONFIGURACIÓN DE LOGGING OPTIMIZADA
quarkus.log.level=INFO
quarkus.log.category."com.distribuida".level=DEBUG
quarkus.log.console.async=true

# HEALTH CHECKS LIGEROS
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready

# CONFIGURACIÓN DE CACHE
quarkus.cache.caffeine."actividad-cache".initial-capacity=100
quarkus.cache.caffeine."actividad-cache".maximum-size=1000
quarkus.cache.caffeine."actividad-cache".expire-after-write=5M

quarkus.cache.caffeine."imagen-cache".initial-capacity=50
quarkus.cache.caffeine."imagen-cache".maximum-size=500
quarkus.cache.caffeine."imagen-cache".expire-after-write=10M

# CONFIGURACIÓN DE SCHEDULER OPTIMIZADA
quarkus.scheduler.enabled=true
quarkus.scheduler.thread-count=4

# CONFIGURACIÓN ESPECÍFICA PARA DESARROLLO
%dev.quarkus.rest-client.ActividadRestClient.connect-timeout=50000
%dev.quarkus.rest-client.ActividadRestClient.read-timeout=100000
%dev.quarkus.log.level=DEBUG

# CONFIGURACIÓN ESPECÍFICA PARA PRODUCCIÓN
%prod.quarkus.rest-client.ActividadRestClient.connect-timeout=80000
%prod.quarkus.rest-client.ActividadRestClient.read-timeout=150000
%prod.quarkus.log.level=WARN
%prod.quarkus.log.console.async=true

# CONFIGURACIÓN PARA TESTING
%test.quarkus.rest-client.ActividadRestClient.connect-timeout=200000
%test.quarkus.rest-client.ActividadRestClient.read-timeout=500000

# CONFIGURACIÓN DE COMPRESIÓN
quarkus.resteasy-reactive.gzip.enabled=true
quarkus.resteasy-reactive.gzip.max-input=1MB

# LÍMITES DE REQUEST PARA EVITAR SOBRECARGA
quarkus.http.limits.max-body-size=10M
quarkus.http.limits.max-chunk-size=1M
quarkus.http.limits.max-form-attribute-size=2048

# CONFIGURACIÓN DE SEGURIDAD OPTIMIZADA
quarkus.http.auth.basic=false
quarkus.http.auth.form.enabled=false

# CONFIGURACIÓN ESPECÍFICA PARA BÚSQUEDAS
app.busqueda.cache.ttl=300000
app.busqueda.batch.size=10
app.busqueda.timeout.ultra=1000
app.busqueda.timeout.imagen=800
app.busqueda.timeout.rating=500
app.busqueda.parallelism=true
app.busqueda.fallback.enabled=true