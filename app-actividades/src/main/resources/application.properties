quarkus.http.port=8090

# JWT Configuration (ISSUER)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://microservices-auth

# REST Clients
quarkus.rest-client.ProveedorRestClient.url=http://localhost:8080
quarkus.rest-client.ReservaRestClient.url=http://localhost:9080
quarkus.rest-client.UsuarioRestClient.url=http://localhost:8080

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*

# Configuración de búsqueda y geocodificacion
search.default.radius.km=50
search.max.results=100
search.cache.ttl.minutes=30

# Google Maps API (para producción)
google.maps.api.key=${GOOGLE_MAPS_API_KEY:your-api-key-here}
google.maps.enabled=false

# Configuración de ubicaciones Ecuador
ecuador.provinces=Azuay,Bolívar,Cañar,Carchi,Chimborazo,Cotopaxi,El Oro,Esmeraldas,Galápagos,Guayas,Imbabura,Loja,Los Ríos,Manabí,Morona Santiago,Napo,Orellana,Pastaza,Pichincha,Santa Elena,Santo Domingo,Sucumbíos,Tungurahua,Zamora Chinchipe

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.distribuida".level=DEBUG

# Performance
quarkus.hibernate-orm.fetch.batch-size=16
quarkus.hibernate-orm.jdbc.statement-batch-size=25

# Cache configuración
quarkus.cache.caffeine."search-cache".expire-after-write=PT30M
quarkus.cache.caffeine."geocoding-cache".expire-after-write=PT24H

# REST Client para sincronización con búsqueda
quarkus.rest-client.BusquedaRestClient.url=http://localhost:8070

# AWS S3 Configuration
aws.s3.bucket-name=turismo-ecuador-bucket
aws.s3.region=us-east-1
aws.s3.access-key=${AWS_ACCESS_KEY:your-access-key}
aws.s3.secret-key=${AWS_SECRET_KEY:your-secret-key}

# Tamaño máximo de archivos (10MB)
quarkus.http.body.uploads-directory=/tmp/uploads
quarkus.http.limits.max-body-size=10M


