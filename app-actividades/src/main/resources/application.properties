# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*

# Configuración de búsqueda y geocodificacion
search.default.radius.km=50
search.max.results=100
search.cache.ttl.minutes=30

# Google Maps API (para producción)
google.maps.api.key=${GOOGLE_MAPS_API_KEY:your-api-key-here}
google.maps.enabled=false

# Configuración de ubicaciones Ecuador
ecuador.provinces=Azuay,Bolívar,Cañar,Carchi,Chimborazo,Cotopaxi,El Oro,Esmeraldas,Galápagos,Guayas,Imbabura,Loja,Los Ríos,Manabí,Morona Santiago,Napo,Orellana,Pastaza,Pichincha,Santa Elena,Santo Domingo,Sucumbíos,Tungurahua,Zamora Chinchipe

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.distribuida".level=DEBUG

# Performance
quarkus.hibernate-orm.fetch.batch-size=16
quarkus.hibernate-orm.jdbc.statement-batch-size=25

# Cache configuración
quarkus.cache.caffeine."search-cache".expire-after-write=PT30M
quarkus.cache.caffeine."geocoding-cache".expire-after-write=PT24H



